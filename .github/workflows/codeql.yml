name: CodeQL

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/**'
  push:
    branches: ["main"]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/**'
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
    outputs:
      runners: ${{ steps.route.outputs.runners }}
    steps:
      - id: route
        uses: baselinehq/costgraph-action/route@v0
        with:
          default: ubicloud-standard-2

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: [route]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}').analyze || 'ubicloud-standard-2' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git for private modules
        env:
          GO_GET_TOKEN: ${{ secrets.GO_GET_TOKEN }}
        run: |
          if [ -n "$GO_GET_TOKEN" ]; then
            git config --global url."https://x-access-token:${GO_GET_TOKEN}@github.com/baselinehq/".insteadOf "https://github.com/baselinehq/"
            echo "GOPRIVATE=github.com/baselinehq/*" >> "$GITHUB_ENV"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
